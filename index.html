<!DOCTYPE>
<html lang="en">
    <head>

        <meta charset="utf-8">
        <title>My Library</title>
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/style.css">
        <script src="js/lib.js" defer></script>

    </head>

    <body>

        <header>
            <h1>My Library</h1>
        </header>

        <main class="shelf">
            <button id="add-btn" command="show-modal"  commandfor="book-form">+</button>

            <dialog id="book-form">
                <form id="add-book">

                    <div class="form-row">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title">
                    </div>

                    <div class="form-row">
                        <label for="author">Author</label>
                        <input type="text" id="author" name="author">
                    </div>

                    <div class="form-row">
                        <label for="pages">Pages</label>
                        <input type="number" max="1500" id="pages" name="pages">
                    </div>

                    
                    <fieldset>
                        <legend>Read?</legend>

                        <label for="read">Yes</label>
                        <input type="radio" id="read" name="read" value="true"/checked>

                        <label for="not-read">No</label>
                        <input type="radio" id="not-read" name="read" value="false"/>
                    </fieldset>

                </form>
            
                <button id="close-btn" commandfor="book-form" command="close">X</button>
            </dialog>

        </main>

        <footer>
            <h2>By TakuSimon</h2>
        </footer>

    </body>
</html>
