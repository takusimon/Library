<!DOCTYPE>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>My Library</title>
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/style.css">
        <script src="js/lib.js" defer></script>
    </head>
    <body>
        <header>
            <h1>My Library</h1>
        </header>
        <main class="shelf">
            <button id="add-btn" command="show-modal"  commandfor="book-form">+</button>

            <dialog id="book-form">
                <button id="close-btn" commandfor="book-form" command="close">X</button>
            </dialog>
        </main>
        <footer>
            <p>By TakuSimon</p>
        </footer>
    </body>
</html>
